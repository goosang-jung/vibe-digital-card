<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김바이브 | 디지털 명함</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card-shell">
    <header class="profile-section">
      <div class="profile-image-wrap">
        <img class="profile-image" src="images/profile.jpg" alt="디지털 명함 프로필 이미지">
      </div>

      <div class="profile-content">
        <p class="badge">VIBE CODING · DIGITAL CARD</p>
        <h1 class="name">김바이브</h1>
        <p class="role">AI 업무자동화 학습자</p>
        <p class="introduction">
          AI와 함께 간단한 웹 프로그램을 만들고,
          업무와 일상에 활용하는 방법을 배우고 있습니다.
        </p>
      </div>
    </header>

    <section class="info-grid">
      <section class="contact-section">
        <p class="section-label">CONTACT</p>
        <h2 class="section-title">연락처</h2>

        <div class="contact-list">
          <div class="contact-item">
            <span class="contact-icon" aria-hidden="true">☎</span>
            <div class="contact-text">
              <span class="contact-label">전화</span>
              <span class="contact-value">010-0000-0000</span>
            </div>
          </div>

          <div class="contact-item">
            <span class="contact-icon" aria-hidden="true">✉</span>
            <div class="contact-text">
              <span class="contact-label">이메일</span>
              <a class="contact-value contact-link" href="mailto:hello@example.com">
                hello@example.com
              </a>
            </div>
          </div>
        </div>

        <a class="email-button" href="mailto:hello@example.com"
           aria-label="hello@example.com으로 이메일 보내기">
          이메일 보내기
        </a>
      </section>

      <section class="qr-section">
        <p class="section-label">QR DIGITAL CARD</p>
        <h2 class="section-title">QR 디지털 명함</h2>

        <div class="qr-box">
          <img class="qr-image" src="images/qr-code.png" alt="디지털 명함 확인용 QR 코드">
        </div>

        <p class="qr-description">
          스마트폰으로 QR 코드를 확인해 보세요.
        </p>
      </section>
    </section>

    <footer class="card-footer">
      <p>AI와 함께 만드는 나의 첫 웹 프로그램</p>
    </footer>
  </main>
</body>
</html>
